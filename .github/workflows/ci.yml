name: ci

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer (pwsh)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force

      - name: Lint (PSScriptAnalyzer, errors only)
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path desktop -Recurse -Severity Error
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r) { exit 1 }

      - name: Tests (PowerShell 7)
        shell: pwsh
        run: Invoke-Pester -Path tests -CI

      - name: Install Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-PackageProvider NuGet -Force | Out-Null
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck

      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: Invoke-Pester -Path tests -CI
